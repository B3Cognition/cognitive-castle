name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - run: pip install -e ".[dev]"
      # Supervision includes caller memory: keep its tests in a fresh process.
      - name: Complete suites with retained timeout diagnostics
        timeout-minutes: 15
        shell: bash
        run: |
          python -u -m pytest tests/ -v --ignore=tests/benchmarks --ignore=tests/test_memory_runtime.py --ignore=tests/test_memory_api_integration.py --cov=cognitive_castle --cov-report=term-missing --cov-fail-under=0 --durations=10 -o faulthandler_timeout=60 --junitxml=pytest-main.xml 2>&1 | tee pytest-main.log
          python -u -m pytest tests/test_memory_runtime.py tests/test_memory_api_integration.py -v --cov=cognitive_castle --cov-append --cov-report=term-missing --cov-fail-under=0 --durations=10 -o faulthandler_timeout=60 --junitxml=pytest-supervision.xml 2>&1 | tee pytest-supervision.log
      - name: Retain test diagnostics before the job deadline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-linux-${{ matrix.python-version }}
          path: |
            pytest-*.log
            pytest-*.xml
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-linux-${{ matrix.python-version }}
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: 'pip'
      - run: pip install -e ".[dev]"
      # Supervision includes caller memory: keep its tests in a fresh process.
      - name: Complete suites with retained timeout diagnostics
        timeout-minutes: 15
        shell: bash
        run: |
          python -u -m pytest tests/ -v --ignore=tests/benchmarks --ignore=tests/test_memory_runtime.py --ignore=tests/test_memory_api_integration.py --cov=cognitive_castle --cov-report=term-missing --cov-fail-under=0 --durations=10 -o faulthandler_timeout=60 --junitxml=pytest-main.xml 2>&1 | tee pytest-main.log
          python -u -m pytest tests/test_memory_runtime.py tests/test_memory_api_integration.py -v --cov=cognitive_castle --cov-append --cov-report=term-missing --cov-fail-under=0 --durations=10 -o faulthandler_timeout=60 --junitxml=pytest-supervision.xml 2>&1 | tee pytest-supervision.log
      - name: Retain test diagnostics before the job deadline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-windows
          path: |
            pytest-*.log
            pytest-*.xml
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-windows
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error

  test-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: 'pip'
      - run: pip install -e ".[dev]"
      # Supervision includes caller memory: keep its tests in a fresh process.
      - name: Complete suites with retained timeout diagnostics
        timeout-minutes: 15
        shell: bash
        run: |
          python -u -m pytest tests/ -v --ignore=tests/benchmarks --ignore=tests/test_memory_runtime.py --ignore=tests/test_memory_api_integration.py --cov=cognitive_castle --cov-report=term-missing --cov-fail-under=0 --durations=10 -o faulthandler_timeout=60 --junitxml=pytest-main.xml 2>&1 | tee pytest-main.log
          python -u -m pytest tests/test_memory_runtime.py tests/test_memory_api_integration.py -v --cov=cognitive_castle --cov-append --cov-report=term-missing --cov-fail-under=0 --durations=10 -o faulthandler_timeout=60 --junitxml=pytest-supervision.xml 2>&1 | tee pytest-supervision.log
      - name: Retain test diagnostics before the job deadline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-macos
          path: |
            pytest-*.log
            pytest-*.xml
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-macos
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    # Platform-specific implementations are measured on their supported hosts.
    # Keep the repository's 85% gate on the union, after every test job passes.
    needs: [test-linux, test-windows, test-macos]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all platform tests to pass
        if: ${{ needs.test-linux.result != 'success' || needs.test-windows.result != 'success' || needs.test-macos.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "coverage[toml]>=7"
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-data
      - name: Require the complete six-job coverage matrix
        run: python -c "from pathlib import Path; files = list(Path('coverage-data').glob('*/.coverage')); assert len(files) == 6, files"
      - run: python -m coverage combine coverage-data/*/.coverage
      - run: python -m coverage report

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: 'pip'
      - run: pip install "ruff==0.15.12"
      - run: ruff check .
      - run: ruff format --check .

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "b3-prosaic-memory-castle"
version = "0.1.0"
description = "Optional scoped Castle memory reads for Prosaic Runtime"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
dependencies = ["b3-prosaic-runtime>=0.9.3,<0.10"]

[project.optional-dependencies]
test = ["pytest>=8", "build>=1.2", "setuptools>=77", "wheel", "b3-prosaic-harness>=0.8.2,<0.10"]
examples = ["b3-prosaic-harness>=0.8.2,<0.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
